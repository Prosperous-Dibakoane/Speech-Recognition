<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎙️ Real-time Speech to Text</title>

    <style>
      /* ✨ Root setup and theme colors */
      :root {
        --primary: #00b4d8;
        --secondary: #ff4b2b;
        --text-light: #f8f9fa;
        --bg-dark: #0b132b;
        --glass-bg: rgba(255, 255, 255, 0.1);
      }

      /* 🌌 Page Layout */
      body {
        margin: 0;
        padding: 0;
        font-family: "Poppins", sans-serif;
        background: linear-gradient(135deg, #0b132b, #1c2541, #3a506b);
        color: var(--text-light);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
      }

      /* 💎 Container */
      .container {
        text-align: center;
        padding: 3rem;
        border-radius: 25px;
        background: var(--glass-bg);
        backdrop-filter: blur(14px);
        box-shadow: 0 0 25px rgba(255, 255, 255, 0.15);
        width: 90%;
        max-width: 520px;
        transition: all 0.4s ease;
      }

      .container:hover {
        box-shadow: 0 0 35px rgba(255, 255, 255, 0.25);
      }

      /* 🪩 Header */
      h1 {
        font-weight: 600;
        color: #caf0f8;
        letter-spacing: 1px;
        margin-bottom: 1.2rem;
      }

      p.subtitle {
        font-size: 0.9rem;
        opacity: 0.8;
        margin-bottom: 2rem;
      }

      /* 🎛️ Button Styles */
      .btn-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 1rem;
        margin-bottom: 2rem;
      }

      button {
        border: none;
        outline: none;
        font-size: 1rem;
        border-radius: 30px;
        padding: 0.9rem 1.8rem;
        color: #fff;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
      }

      .btn-start {
        background: linear-gradient(90deg, var(--primary), #0077b6);
        box-shadow: 0 4px 15px rgba(0, 180, 216, 0.4);
      }

      .btn-start:hover {
        transform: scale(1.05);
        box-shadow: 0 4px 25px rgba(0, 180, 216, 0.6);
      }

      .btn-stop {
        background: linear-gradient(90deg, var(--secondary), #ff416c);
        box-shadow: 0 4px 15px rgba(255, 75, 43, 0.4);
      }

      .btn-stop:hover {
        transform: scale(1.05);
        box-shadow: 0 4px 25px rgba(255, 75, 43, 0.6);
      }

      .btn-stop:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      /* 🔵 Recording Animation */
      .recording svg {
        animation: pulse 1.2s infinite ease-in-out;
      }

      @keyframes pulse {
        0% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.15);
        }
        100% {
          transform: scale(1);
        }
      }

      svg {
        width: 20px;
        height: 20px;
        fill: #fff;
      }

      .hidden {
        display: none;
      }

      /* 🗒️ Result Box */
      #result {
        min-height: 120px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 15px;
        padding: 1.5rem;
        text-align: left;
        font-size: 1.05rem;
        line-height: 1.6;
        white-space: pre-wrap;
        box-shadow: inset 0 0 12px rgba(255, 255, 255, 0.15);
        transition: background 0.3s;
      }

      #result.listening {
        background: rgba(0, 180, 216, 0.12);
      }

      #result.error {
        color: #ff6b6b;
      }

      footer {
        margin-top: 1.5rem;
        font-size: 0.85rem;
        opacity: 0.7;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>🎙️ Real-Time Speech-to-Text</h1>
      <p class="subtitle">
        Speak naturally — your words will appear below in real time.
      </p>

      <div class="btn-wrapper">
        <button id="startBtn" class="btn-start">
          <svg viewBox="0 0 24 24">
            <path d="M12 2C13.1 2 14 2.9 14 4V12C14 13.1 13.1 14 12 14C10.9 14 10 13.1 10 12V4C10 2.9 10.9 2 12 2ZM18 11C18 14.31 15.31 17 12 17C8.69 17 6 14.31 6 11H8C8 13.21 9.79 15 12 15C14.21 15 16 13.21 16 11H18ZM12 19C16.42 19 20 15.42 20 11H22C22 16.52 17.52 21 12 21C6.48 21 2 16.52 2 11H4C4 15.42 7.58 19 12 19Z"/>
          </svg>
          <span>Start Listening</span>
        </button>

        <button id="stopBtn" class="btn-stop" disabled>Stop</button>
      </div>

      <div id="result">Your words will appear here...</div>

      <footer>Built with ❤️ using the Web Speech API</footer>
    </div>

    <script>
      const resultElement = document.getElementById("result");
      const startBtn = document.getElementById("startBtn");
      const stopBtn = document.getElementById("stopBtn");

      let recognition = window.SpeechRecognition || window.webkitSpeechRecognition;

      if (recognition) {
        recognition = new recognition();
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.lang = "en-US";

        recognition.onstart = () => {
          resultElement.textContent = "Listening...";
          resultElement.classList.add("listening");
          startBtn.disabled = true;
          stopBtn.disabled = false;
          startBtn.classList.add("recording");
        };

        recognition.onresult = (event) => {
          let transcript = "";
          for (let i = event.resultIndex; i < event.results.length; i++) {
            transcript += event.results[i][0].transcript;
          }
          resultElement.textContent = transcript;

          if (transcript.toLowerCase().includes("stop recording")) {
            stopRecording();
            resultElement.textContent = transcript.replace(/stop recording/gi, "");
          }
        };

        recognition.onerror = (event) => {
          resultElement.textContent = "Error: " + event.error;
          resultElement.classList.add("error");
          startBtn.disabled = false;
          stopBtn.disabled = true;
        };

        recognition.onend = () => {
          resultElement.classList.remove("listening");
          startBtn.disabled = false;
          stopBtn.disabled = true;
          startBtn.classList.remove("recording");
        };
      } else {
        resultElement.textContent =
          "Your browser doesn’t support Speech Recognition 😢";
        resultElement.classList.add("error");
      }

      function startRecording() {
        resultElement.textContent = "";
        recognition.start();
      }

      function stopRecording() {
        if (recognition) recognition.stop();
      }

      startBtn.addEventListener("click", startRecording);
      stopBtn.addEventListener("click", stopRecording);
    </script>
  </body>
</html>
